[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "darija-rag"
version = "0.1.0"
description = "Arabic/Darija retrieval-augmented QA over Moroccan legal texts, with an evaluation harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.26,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "ruff>=0.12,<1"]

[project.scripts]
darija-rag = "darija_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint.isort]
known-first-party = ["darija_rag"]
